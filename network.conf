# Lab network: built on the Proxmox host by ansible/bootstrap.yml, read by
# OpenTofu for the node addresses and by the playbooks for the OpenStack
# configuration. See NETWORK.md for the design.
#
# Vnet names are at most 8 characters. A network without a gateway is
# isolated: the Proxmox host gets no address on it and does not route it.

SDN_ZONE=openstk

# Everything the lab uses. The LAN router routes this range to the Proxmox
# host and NATs it to the internet. Set LAB_SNAT=yes if the router cannot,
# and the Proxmox host source-NATs the range to its own address instead.
# nutanix-lab uses the same range, so only one of the two can be built at a
# time; the bootstrap refuses to run while another SDN zone overlaps it
LAB_RANGE=192.168.32.0/21
LAB_SNAT=no

# Node n gets host address NODE_HOST_START + n - 1 on every network with an
# address; the HAProxy VIPs get VIP_HOST on the management and API networks
NODE_HOST_START=11
VIP_HOST=10

# SSH, internal API endpoints, MariaDB, RabbitMQ, Ceph orchestration
MGMT_VNET=osmgmt
MGMT_SUBNET=192.168.32.0/24
MGMT_GATEWAY=192.168.32.1

# Public API endpoints, Horizon and DNS (Designate), behind TLS
API_VNET=osapi
API_SUBNET=192.168.33.0/24
API_GATEWAY=192.168.33.1

# Ceph public network: clients (Nova, Cinder, Glance, RGW) to the OSDs
STORAGE_VNET=osstor
STORAGE_SUBNET=192.168.34.0/24

# Ceph cluster network: OSD replication and recovery
REPLICATION_VNET=osrepl
REPLICATION_SUBNET=192.168.35.0/24

# Geneve tunnels for the tenant networks
TUNNEL_VNET=ostun
TUNNEL_SUBNET=192.168.36.0/24

# Provider network for router gateways and floating IPs. The nodes have no
# address on it; Neutron hands out POOL_START-POOL_END
PROVIDER_VNET=osext
PROVIDER_SUBNET=192.168.37.0/24
PROVIDER_GATEWAY=192.168.37.1
PROVIDER_POOL_START=192.168.37.100
PROVIDER_POOL_END=192.168.37.250

# For the nodes and the tenant subnets: Themis, the LAN's resolver
DNS_SERVERS="192.168.8.50"
NTP_SERVERS="2.debian.pool.ntp.org"

# The lab's names. The bootstrap creates DOMAIN and the reverse zones of the
# networks with node addresses on the PowerDNS authoritative server, through
# its API (called from the Proxmox host); the teardown deletes them. The API
# key is AUTH_API_KEY in PDNS_API_KEY_FILE, relative to this repository, or
# the PDNS_API_KEY environment variable. Leave PDNS_API empty to skip DNS
DOMAIN=openstack.home
PDNS_API=https://pythia.home:8081
PDNS_SERVER_NS=pythia.home
PDNS_API_KEY_FILE=../homelab/dns/secrets.env
