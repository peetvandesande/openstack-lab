# The system journal, which Kolla collects as is: give it the fields the
# other logs have. Kolla-Ansible renders this file as a template, so it
# must stay free of Jinja.
<filter journal>
  @type record_transformer
  enable_ruby true
  <record>
    Hostname ${record["hostname"]}
    programname ${record["syslog_identifier"] || record["systemd_unit"] || "journal"}
    Payload ${record["message"]}
    log_level ${record["priority"] ? ["EMERG", "ALERT", "CRIT", "ERROR", "WARNING", "NOTICE", "INFO", "DEBUG"][record["priority"].to_i] : "INFO"}
  </record>
  remove_keys message
</filter>
