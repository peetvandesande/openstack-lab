# Day-2 configuration a provider does before handing out projects: the
# public network, flavours, images, the Octavia amphora image, a volume type
# and one onboarded customer. Runs on the deployment host with the
# OpenStack SDK from the Kolla virtualenv. Imported by site.yml; safe to
# re-run.

- name: Configure the cloud
  hosts: openstack[0]
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ kolla_venv }}/bin/python"
    image_cache: /var/cache/openstack-lab
    cloud: kolla-admin
    customer_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/../secrets/' ~ customer.user ~ '-password', chars=['ascii_letters', 'digits'], length=20) }}"
  environment:
    OS_CLIENT_CONFIG_FILE: /etc/kolla/clouds.yaml
  module_defaults:
    group/openstack.cloud.openstack:
      cloud: "{{ cloud }}"
  tasks:
    # Floating IPs and router gateways. Flat on physnet1, which Kolla maps to
    # br-ex and the ext NIC; the Proxmox host is the gateway
    - name: Create the public network
      openstack.cloud.network:
        name: "{{ public_network }}"
        external: true
        shared: false
        provider_network_type: flat
        provider_physical_network: physnet1

    - name: Create the public subnet
      openstack.cloud.subnet:
        name: "{{ public_network }}-subnet"
        network: "{{ public_network }}"
        cidr: "{{ lab_net.provider_subnet }}"
        gateway_ip: "{{ lab_net.provider_gateway }}"
        allocation_pool_start: "{{ lab_net.provider_pool_start }}"
        allocation_pool_end: "{{ lab_net.provider_pool_end }}"
        is_dhcp_enabled: false

    - name: Create the flavours
      openstack.cloud.compute_flavor:
        name: "{{ item.name }}"
        vcpus: "{{ item.vcpus }}"
        ram: "{{ item.ram }}"
        disk: "{{ item.disk }}"
        is_public: true
      loop: "{{ flavors }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the volume type
      openstack.cloud.volume_type:
        name: standard
        description: Ceph RBD, 3 replicas
        extra_specs:
          volume_backend_name: rbd-1
        is_public: true

    # Images are stored raw, so Nova and Cinder clone them in Ceph instead of
    # copying them
    - name: Create the image cache
      ansible.builtin.file:
        path: "{{ image_cache }}"
        state: directory
        mode: "0755"

    - name: Download the images
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ image_cache }}/{{ item.name }}.qcow2"
        mode: "0644"
      loop: "{{ images + (enable_octavia | ternary([{'name': 'amphora', 'url': amphora_image_url}], [])) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Convert the images to raw
      ansible.builtin.command: qemu-img convert -O raw {{ image_cache }}/{{ item.name }}.qcow2 {{ image_cache }}/{{ item.name }}.raw
      args:
        creates: "{{ image_cache }}/{{ item.name }}.raw"
      loop: "{{ images + (enable_octavia | ternary([{'name': 'amphora'}], [])) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Upload the public images
      openstack.cloud.image:
        name: "{{ item.name }}"
        filename: "{{ image_cache }}/{{ item.name }}.raw"
        disk_format: raw
        container_format: bare
        is_public: true
        properties:
          os_distro: "{{ item.os_distro }}"
          hw_qemu_guest_agent: "yes"
          hw_disk_bus: scsi
          hw_scsi_model: virtio-scsi
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.name }}"

    # Octavia finds it by tag, in the service project
    - name: Upload the amphora image
      openstack.cloud.image:
        name: amphora-x64-haproxy
        filename: "{{ image_cache }}/amphora.raw"
        disk_format: raw
        container_format: bare
        is_public: false
        owner: service
        tags: [amphora]
      when: enable_octavia

    # Onboarding: a domain for customers, then a project, a user, a quota and
    # a routed network per customer
    - name: Create the customer domain
      openstack.cloud.identity_domain:
        name: "{{ customer.domain }}"
        description: Customer projects

    - name: Create the customer project
      openstack.cloud.project:
        name: "{{ customer.project }}"
        domain: "{{ customer.domain }}"
      register: customer_project

    - name: Create the customer user
      openstack.cloud.identity_user:
        name: "{{ customer.user }}"
        domain: "{{ customer.domain }}"
        default_project: "{{ customer_project.project.id }}"
        password: "{{ customer_password }}"
        update_password: on_create
      register: customer_user
      no_log: true

    - name: Give the user the member role
      openstack.cloud.role_assignment:
        user: "{{ customer_user.user.id }}"
        project: "{{ customer_project.project.id }}"
        role: member

    - name: Set the quota
      openstack.cloud.quota:
        name: "{{ customer_project.project.id }}"
        instances: "{{ customer.quota.instances }}"
        cores: "{{ customer.quota.cores }}"
        ram: "{{ customer.quota.ram }}"
        volumes: "{{ customer.quota.volumes }}"
        gigabytes: "{{ customer.quota.gigabytes }}"
        floating_ips: "{{ customer.quota.floating_ips }}"

    - name: Create the customer network
      openstack.cloud.network:
        name: "{{ customer.project }}-net"
        project: "{{ customer_project.project.id }}"
      register: customer_net

    - name: Create the customer subnet
      openstack.cloud.subnet:
        name: "{{ customer.project }}-subnet"
        project: "{{ customer_project.project.id }}"
        network: "{{ customer_net.network.id }}"
        cidr: "{{ customer.network_cidr }}"
        dns_nameservers: "{{ lab_net.dns_servers.split() }}"
      register: customer_subnet

    - name: Create the customer router
      openstack.cloud.router:
        name: "{{ customer.project }}-router"
        project: "{{ customer_project.project.id }}"
        network: "{{ public_network }}"
        interfaces:
          - "{{ customer_subnet.subnet.id }}"

    - name: Create a security group for SSH and ping
      openstack.cloud.security_group:
        name: ssh-icmp
        description: SSH and ICMP from anywhere
        project: "{{ customer_project.project.id }}"
      register: customer_sg

    - name: Allow SSH and ping
      openstack.cloud.security_group_rule:
        security_group: "{{ customer_sg.security_group.id }}"
        project: "{{ customer_project.project.id }}"
        protocol: "{{ item.protocol }}"
        port_range_min: "{{ item.port | default(omit) }}"
        port_range_max: "{{ item.port | default(omit) }}"
        remote_ip_prefix: 0.0.0.0/0
      loop:
        - { protocol: tcp, port: 22 }
        - { protocol: icmp }

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Customer {{ customer.user }}@{{ customer.domain }} (project {{ customer.project }}),
          password in secrets/{{ customer.user }}-password
