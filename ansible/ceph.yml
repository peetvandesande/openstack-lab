# Ceph cluster with cephadm, on the same nodes: a monitor, a manager, two
# OSDs and an RGW on every node; client traffic on the storage network,
# replication on its own. Creates the pools and client keys OpenStack uses
# and writes them into /etc/kolla/config. Imported by site.yml after
# kolla-host.yml, which installs Docker.

- name: Deploy Ceph
  hosts: openstack[0]
  gather_facts: false
  vars:
    ceph_hosts: "{{ groups['openstack'] }}"
    expected_osds: "{{ ceph_hosts | length * osd_disk_count | int }}"
    # Before ceph_dashboard_password moved to passwords.yml
    old_dashboard_password_file: "{{ playbook_dir }}/../secrets/ceph-dashboard-password"
    dashboard_cert_dir: /etc/ceph/dashboard
    kolla_ca_dir: /etc/kolla/certificates/private/root
    rbd_pools: [volumes, images, vms, backups]
    client_keys:
      glance: >-
        mon 'profile rbd' osd 'profile rbd pool=images' mgr 'profile rbd pool=images'
      cinder: >-
        mon 'profile rbd'
        osd 'profile rbd pool=volumes, profile rbd pool=vms, profile rbd-read-only pool=images'
        mgr 'profile rbd pool=volumes, profile rbd pool=vms'
      cinder-backup: >-
        mon 'profile rbd' osd 'profile rbd pool=backups' mgr 'profile rbd pool=backups'
      gnocchi: >-
        mon 'allow r' osd 'allow rwx pool=gnocchi'
    # Which files each Kolla service gets, under /etc/kolla/config
    kolla_ceph_files:
      - { dir: glance, keys: [glance] }
      - { dir: cinder, keys: [] }
      - { dir: cinder/cinder-volume, keys: [cinder] }
      - { dir: cinder/cinder-backup, keys: [cinder, cinder-backup] }
      - { dir: nova, keys: [cinder] }
      - { dir: gnocchi, keys: [gnocchi] }
  tasks:
    # --no-install-recommends: cephadm recommends podman, but Kolla's Docker
    # is used instead
    - name: Install cephadm and the Ceph CLI
      ansible.builtin.apt:
        name: [cephadm, ceph-common]
        install_recommends: false

    - name: Check for an existing cluster
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: ceph_conf

    # The dashboard password lives with Kolla's; kolla-genpwd keeps entries
    # it doesn't know
    - name: Read the Kolla passwords
      ansible.builtin.slurp:
        src: /etc/kolla/passwords.yml
      register: kolla_passwords
      no_log: true

    - name: Pick the dashboard password
      ansible.builtin.set_fact:
        dashboard_password: >-
          {{ (kolla_passwords.content | b64decode | from_yaml).ceph_dashboard_password
             | default(lookup('ansible.builtin.file', old_dashboard_password_file, errors='ignore'), true)
             | default(lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=20), true) }}
      no_log: true

    - name: Store the dashboard password in passwords.yml
      ansible.builtin.lineinfile:
        path: /etc/kolla/passwords.yml
        regexp: "^ceph_dashboard_password:"
        line: "ceph_dashboard_password: {{ dashboard_password }}"
      no_log: true

    - name: Bootstrap the cluster
      ansible.builtin.command: >-
        cephadm --image {{ ceph_image }} bootstrap
        --mon-ip {{ storage_ip }}
        --cluster-network {{ lab_net.replication_subnet }}
        --ssh-user root
        --skip-monitoring-stack
        --initial-dashboard-user admin
        --initial-dashboard-password {{ dashboard_password }}
        --dashboard-password-noupdate
      when: not ceph_conf.stat.exists
      changed_when: true
      no_log: true

    # Bootstrap sets the public network for the monitors only; without it
    # globally, an OSD may bind to whichever address it finds first on start
    - name: Set the public network for every daemon
      ansible.builtin.command: ceph config set global public_network {{ lab_net.storage_subnet }}
      changed_when: false

    - name: Read the orchestrator's SSH key
      ansible.builtin.slurp:
        src: /etc/ceph/ceph.pub
      register: ceph_pub

    - name: Authorise the orchestrator on every node
      ansible.posix.authorized_key:
        user: root
        key: "{{ ceph_pub.content | b64decode }}"
      delegate_to: "{{ item }}"
      loop: "{{ ceph_hosts }}"

    - name: List the Ceph hosts
      ansible.builtin.command: ceph orch host ls --format json
      register: orch_hosts
      changed_when: false

    - name: Add the other nodes
      ansible.builtin.command: >-
        ceph orch host add {{ item }} {{ hostvars[item].storage_ip }} _admin
      loop: "{{ ceph_hosts | difference(orch_hosts.stdout | from_json | map(attribute='hostname')) }}"
      changed_when: true

    - name: Place a monitor and a manager on every node
      ansible.builtin.command: ceph orch apply {{ item }} --placement="{{ ceph_hosts | join(',') }}"
      loop: [mon, mgr]
      changed_when: false

    - name: Use every empty disk as an OSD
      ansible.builtin.command: ceph orch apply osd --all-available-devices
      changed_when: false

    - name: Wait for the OSDs
      ansible.builtin.command: ceph osd stat --format json
      register: osd_stat
      until: (osd_stat.stdout | from_json).num_up_osds | int >= expected_osds | int
      retries: 60
      delay: 20
      changed_when: false

    # Scraped by Kolla's Prometheus
    - name: Enable the Prometheus exporter
      ansible.builtin.command: ceph mgr module enable prometheus
      changed_when: false

    # Bootstrap only sets the password on a new cluster
    - name: Set the dashboard password
      ansible.builtin.command: ceph dashboard ac-user-set-password admin --force-password -i /dev/stdin
      args:
        stdin: "{{ dashboard_password }}"
        stdin_add_newline: false
      changed_when: false
      no_log: true

    # A certificate from the lab CA, which kolla-host.yml created, for every
    # node's name and address. At most 825 days, or macOS won't trust it
    - name: Create the dashboard certificate directory
      ansible.builtin.file:
        path: "{{ dashboard_cert_dir }}"
        state: directory
        mode: "0700"

    - name: Create the dashboard key
      community.crypto.openssl_privatekey:
        path: "{{ dashboard_cert_dir }}/dashboard.key"
        mode: "0600"

    - name: Create the dashboard certificate request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ dashboard_cert_dir }}/dashboard.key"
        common_name: "{{ ceph_hosts[0] }}.{{ lab_net.domain }}"
        subject_alt_name: >-
          {{ (ceph_hosts | map('regex_replace', '$', '.' ~ lab_net.domain) | map('regex_replace', '^', 'DNS:') | list)
             + (ceph_hosts | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^', 'IP:') | list) }}
        extended_key_usage: [serverAuth]
      register: dashboard_csr
      changed_when: false

    - name: Sign the dashboard certificate with the lab CA
      community.crypto.x509_certificate:
        path: "{{ dashboard_cert_dir }}/dashboard.crt"
        csr_content: "{{ dashboard_csr.csr }}"
        provider: ownca
        ownca_path: "{{ kolla_ca_dir }}/root.crt"
        ownca_privatekey_path: "{{ kolla_ca_dir }}/root.key"
        ownca_not_after: +825d
        mode: "0644"
      register: dashboard_cert

    - name: Give the dashboard its certificate
      ansible.builtin.shell: >-
        ceph dashboard set-ssl-certificate -i {{ dashboard_cert_dir }}/dashboard.crt &&
        ceph dashboard set-ssl-certificate-key -i {{ dashboard_cert_dir }}/dashboard.key
      when: dashboard_cert is changed
      changed_when: true

    - name: List the managers
      ansible.builtin.command: ceph orch ps --daemon-type mgr --format json
      register: mgrs
      changed_when: false

    # By default a dashboard listens everywhere but calls itself by its
    # storage address, which your machine can't reach, and a standby sends
    # you there. Use the node's own address instead
    - name: Serve each dashboard on its node's address
      ansible.builtin.shell: |
        key=mgr/dashboard/{{ item.daemon_id }}/server_addr
        [ "$(ceph config get mgr $key)" = "{{ hostvars[item.hostname].ansible_host }}" ] && exit 0
        ceph config set mgr $key {{ hostvars[item.hostname].ansible_host }} && echo changed
      loop: "{{ mgrs.stdout | from_json }}"
      loop_control:
        label: "{{ item.daemon_name }}"
      register: dashboard_addrs
      changed_when: "'changed' in dashboard_addrs.stdout"

    - name: Restart the dashboard
      ansible.builtin.shell: ceph mgr module disable dashboard && ceph mgr module enable dashboard
      when: dashboard_cert is changed or dashboard_addrs is changed
      changed_when: true

    - name: Create the RBD pools
      ansible.builtin.shell: ceph osd pool create {{ item }} && rbd pool init {{ item }}
      loop: "{{ rbd_pools }}"
      changed_when: false

    - name: Create the Gnocchi pool
      ansible.builtin.shell: >-
        ceph osd pool create gnocchi &&
        ceph osd pool application enable gnocchi gnocchi --yes-i-really-mean-it
      when: enable_metering
      changed_when: false

    - name: Deploy the RADOS gateways
      when: enable_ceph_rgw
      block:
        - name: Write the RGW spec
          ansible.builtin.copy:
            dest: /etc/ceph/rgw.yml
            mode: "0644"
            content: |
              service_type: rgw
              service_id: default
              placement:
                hosts: {{ ceph_hosts | to_json }}
              networks:
                - {{ lab_net.storage_subnet }}
              spec:
                rgw_frontend_port: 7480

        - name: Apply the RGW spec
          ansible.builtin.command: ceph orch apply -i /etc/ceph/rgw.yml
          changed_when: false

    - name: Create the client keys
      ansible.builtin.command: ceph auth get-or-create client.{{ item.key }} {{ item.value }}
      loop: "{{ client_keys | dict2items }}"
      loop_control:
        label: client.{{ item.key }}
      register: keyrings
      changed_when: false
      no_log: true

    - name: Generate a minimal ceph.conf
      ansible.builtin.command: ceph config generate-minimal-conf
      register: minimal_conf
      changed_when: false

    - name: Create the Kolla config directories
      ansible.builtin.file:
        path: /etc/kolla/config/{{ item.dir }}
        state: directory
        owner: "{{ kolla_user }}"
        mode: "0755"
      loop: "{{ kolla_ceph_files }}"
      loop_control:
        label: "{{ item.dir }}"

    # Kolla's config merge chokes on the tabs Ceph indents with
    - name: Write ceph.conf for the OpenStack services
      ansible.builtin.copy:
        dest: /etc/kolla/config/{{ item }}/ceph.conf
        content: "{{ minimal_conf.stdout | regex_replace('(?m)^\\s+', '') }}\n"
        owner: "{{ kolla_user }}"
        mode: "0644"
      loop: [glance, cinder, nova, gnocchi]

    - name: Write the keyrings
      ansible.builtin.copy:
        dest: /etc/kolla/config/{{ item.0.dir }}/ceph.client.{{ item.1 }}.keyring
        content: "{{ (keyrings.results | selectattr('item.key', 'equalto', item.1) | first).stdout | regex_replace('(?m)^\\s+', '') }}\n"
        owner: "{{ kolla_user }}"
        mode: "0600"
      loop: "{{ kolla_ceph_files | subelements('keys') }}"
      loop_control:
        label: "{{ item.0.dir }}/ceph.client.{{ item.1 }}.keyring"
      no_log: true

    - name: Report the cluster health
      ansible.builtin.command: ceph -s
      register: ceph_status
      changed_when: false

    - name: Ceph status
      ansible.builtin.debug:
        msg: "{{ ceph_status.stdout_lines }}"
